name: Test

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_call:

jobs:
  test:
    # windows-latest: the solution contains ConsoleTest (net462).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The projects in TestProject are live integration tests (real Dropbox/Google/Microsoft/proxy
      # services and personal tokens), so they cannot run on a CI runner. CI therefore gates on a
      # Release build of the whole solution; run `dotnet test` locally with real credentials.
      # GitVersion is skipped: a build check does not need a real version (and it fails on branches
      # without a full SemVer tag).
      - name: Build
        shell: pwsh
        run: |
          dotnet build src/TqkLibrary.Http.Utils.sln -c Release -p:DisableGitVersionTask=true -p:Version=0.0.0
          if ($LASTEXITCODE -ne 0) { exit 1 }
